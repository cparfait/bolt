# Élan — publication Internet de la seule feuille d'émargement, via Apache.
#
# Modules requis (Debian/Ubuntu) :
#   a2enmod ssl proxy proxy_http headers
#
# Chemins exposés sur Internet — rien d'autre ne quitte le réseau :
#   /emargement/*     feuille d'émargement des animateurs (pages + actions serveur)
#   /_next/static/*   fichiers JS/CSS de l'application (empreinte immuable)
#   /favicon.ico
# Le back-office, /connexion (Active Directory) et l'API restent injoignables :
# Apache répond 403 sans même contacter l'application.
#
# Défense en profondeur : renseignez aussi INTERNAL_CIDRS dans le .env d'Élan
# (ex. INTERNAL_CIDRS=10.0.0.0/8,192.168.0.0/16). L'application refusera alors
# elle-même tout chemin non public venant d'une IP externe, même si cette
# configuration Apache était un jour contournée ou mal recopiée.

# ---------------------------------------------------------------------------
# À poser une seule fois dans la configuration globale (pas par vhost) :
#   ServerTokens Prod
#   ServerSignature Off
#   TraceEnable Off
# ---------------------------------------------------------------------------

<VirtualHost *:80>
    ServerName emargement.chatillon92.fr
    # Redirection systématique vers HTTPS, rien n'est servi en clair.
    Redirect permanent / https://emargement.chatillon92.fr/
</VirtualHost>

<VirtualHost *:443>
    ServerName emargement.chatillon92.fr

    # --- TLS -----------------------------------------------------------------
    SSLEngine on
    SSLCertificateFile      /etc/ssl/elan/fullchain.pem
    SSLCertificateKeyFile   /etc/ssl/elan/privkey.pem
    # TLS 1.2 minimum, suites « intermediate » Mozilla.
    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder     off
    SSLSessionTickets       off

    # --- En-têtes transmis à l'application ----------------------------------
    # CRITIQUE : Apache AJOUTE l'IP du client à un X-Forwarded-For déjà présent
    # au lieu de l'écraser, et Élan lit la PREMIÈRE adresse de la liste. Sans la
    # purge ci-dessous, un client Internet enverrait « X-Forwarded-For:
    # 10.0.0.1 » et se ferait passer pour une IP interne auprès du filtre
    # INTERNAL_CIDRS. « early » purge l'en-tête dès la lecture de la requête ;
    # mod_proxy le recrée ensuite avec la seule adresse réelle du client.
    RequestHeader unset X-Forwarded-For   early
    RequestHeader unset X-Forwarded-Host  early
    RequestHeader unset X-Real-IP         early
    RequestHeader unset Forwarded         early
    RequestHeader set   X-Forwarded-Proto "https"

    # --- Proxy ---------------------------------------------------------------
    ProxyRequests     Off
    # Host d'origine conservé : exigé par la vérification d'origine des actions
    # serveur de Next.js (sinon l'émargement échoue en « Invalid Server Actions
    # request »).
    ProxyPreserveHost On
    ProxyTimeout      60

    # Seuls ces trois préfixes atteignent l'application.
    ProxyPass        /emargement/    http://127.0.0.1:3100/emargement/ retry=0
    ProxyPassReverse /emargement/    http://127.0.0.1:3100/emargement/
    ProxyPass        /_next/static/  http://127.0.0.1:3100/_next/static/ retry=0
    ProxyPass        /favicon.ico    http://127.0.0.1:3100/favicon.ico retry=0

    # --- Cloisonnement : tout est refusé, puis on rouvre le strict minimum ---
    <Location "/">
        Require all denied
    </Location>

    <Location "/emargement">
        Require all granted
        # La feuille d'émargement ne fait que du GET (pages) et du POST
        # (actions serveur) ; toute autre méthode est refusée.
        <LimitExcept GET POST HEAD>
            Require all denied
        </LimitExcept>
        # Pointages et signatures : quelques kilo-octets. 1 Mo de marge, tout
        # envoi plus gros est nécessairement anormal.
        LimitRequestBody 1048576
    </Location>

    <Location "/_next/static">
        Require all granted
        <LimitExcept GET HEAD>
            Require all denied
        </LimitExcept>
    </Location>

    <Location "/favicon.ico">
        Require all granted
        <LimitExcept GET HEAD>
            Require all denied
        </LimitExcept>
    </Location>

    # --- Divers --------------------------------------------------------------
    # HSTS aussi sur les réponses émises par Apache lui-même (403, erreurs) ;
    # l'application pose déjà les autres en-têtes de sécurité (CSP, X-Frame-
    # Options…) sur tout ce qu'elle sert.
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"

    ErrorLog  ${APACHE_LOG_DIR}/elan-emargement-error.log
    CustomLog ${APACHE_LOG_DIR}/elan-emargement-access.log combined
</VirtualHost>
