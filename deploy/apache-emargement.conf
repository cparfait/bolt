# Bolt — publication Internet de la seule feuille d'émargement, via Apache.
#
# Modules requis (Debian/Ubuntu) :
#   a2enmod ssl proxy proxy_http headers http2
#
# Topologie visée :
#   Internet ──443──> Apache (DMZ) ──80/tcp (règle pare-feu)──> NPM (LAN) ──> bolt_web:3000
#
# ATTENTION, CHAÎNE À DEUX PROXYS : Bolt lit la PREMIÈRE adresse de
# X-Forwarded-For (src/lib/net.ts:51). Nginx Proxy Manager pose par défaut
#   proxy_set_header X-Forwarded-For $remote_addr;
# ce qui ÉCRASE la valeur transmise par Apache : l'application ne voit alors plus
# que l'IP d'Apache, pour tous les visiteurs. Conséquences concrètes :
#   - le coupe-circuit anti-balayage du PIN (20 essais / 10 min par IP,
#     src/lib/coach-access.ts:188) devient commun à TOUS les animateurs : une
#     vingtaine d'erreurs de saisie et plus personne ne peut pointer ;
#   - le filtre INTERNAL_CIDRS (src/proxy.ts) juge « interne » n'importe quel
#     visiteur d'Internet : le second verrou ne verrouille plus rien ;
#   - le journal d'audit horodate tout au nom d'Apache.
# NPM doit donc rétablir l'IP réelle (set_real_ip_from, module realip) et
# forcer X-Forwarded-Proto à https — voir § 3 et deploy/npm-boltpointage.md.
#
# Chemins exposés sur Internet — rien d'autre ne quitte le réseau :
#   /emargement/*     feuille d'émargement des animateurs (pages + actions serveur)
#                     inclut /emargement/sw.js et .../manifest.webmanifest
#   /icones/*         icônes d'installation sur l'écran d'accueil (PWA)
#   /_next/static/*   fichiers JS/CSS de l'application (empreinte immuable)
#   /favicon.ico, /robots.txt, /apple-touch-icon*.png
# Et, si l'espace agent est publié (bloc « Espace agent », commenté par défaut) :
#   /acces, /mes-activites, /mentions, /demande-acces
# Le back-office, /connexion (Active Directory) et l'API restent injoignables
# dans tous les cas : Apache répond 403 sans même contacter l'application.
#
# Défense en profondeur : renseignez aussi INTERNAL_CIDRS dans le .env de Bolt
# (ex. INTERNAL_CIDRS=10.0.0.0/8,192.168.0.0/16). L'application refusera alors
# elle-même tout chemin non public venant d'une IP externe, même si cette
# configuration Apache était un jour contournée ou mal recopiée.

# ---------------------------------------------------------------------------
# À poser une seule fois dans la configuration globale (pas par vhost) :
#   ServerTokens Prod
#   ServerSignature Off
#   TraceEnable Off
# ---------------------------------------------------------------------------

# ===========================================================================
# 1. Hôte par défaut
# ===========================================================================
# Quand le SNI ou l'en-tête Host ne correspond à aucun ServerName, Apache sert
# le PREMIER vhost *:443 chargé. Sur le proxy de la collectivité, ce rôle est
# déjà tenu : le premier vhost du fichier (« vhostuntrust ») redirige tout nom
# inconnu vers https://ville-chatillon.fr. Un scan de l'adresse publique tombe
# donc sur une redirection vers le site de la ville, pas sur un site interne.
# Rien à ajouter ici — mais deux invariants à préserver :
#   - ce vhost fourre-tout doit RESTER le premier chargé (vérifier avec
#     « apache2ctl -S », ligne « default server », après tout ajout de vhost) ;
#   - il ne doit jamais recevoir de ProxyPass : une redirection ne divulgue
#     rien, un proxy par défaut divulguerait un backend.
# ATTENTION : ce mécanisme ne protège que contre les noms INCONNUS. Un vhost
# nommé reste joignable depuis Internet en forgeant son Host/SNI, que son nom
# soit publié au DNS ou non. Sur ce proxy, c'est voulu : tous les vhosts servent
# des applications publiques — sauf l'intranet, qui porte son propre filtrage
# par IP source. Règle à appliquer à chaque FUTUR vhost : s'il ne doit pas être
# joignable d'Internet, il doit porter un « Require ip <plages internes> » ;
# aucun autre mécanisme (DNS interne, obscurité du nom) n'en tient lieu.


################################################
###### Configuration du site BOLT POINTAGE #####
################################################

# Point d'entrée suivant de la chaîne : NPM sur le LAN, en HTTP (le TLS est
# terminé ici, sur Apache). Le seul endroit à modifier : remplacez 192.168.0.0
# par l'IP LAN de NPM, et le port par celui de son écoute HTTP.
# NPM doit posséder un « Proxy Host » pour boltpointage.chatillon92.fr pointant
# sur bolt_web:3000, SANS « Force SSL » ni « HSTS » : le tronçon Apache → NPM est
# en clair, et une redirection 301 vers https ferait boucler la chaîne.
# Volontairement HORS du vhost : selon la version d'Apache, « Define » n'est pas
# accepté en contexte <VirtualHost>.
Define BOLT_BACKEND http://192.168.0.0:80

<VirtualHost *:443>

# Nom de domaine En-Tête HTTP
                ServerName boltpointage.chatillon92.fr

# E-Mail de l'administrateur
                ServerAdmin informatique@chatillon92.fr

# Activation du protocole HTTP/2
                Protocols h2 http/1.1

# Activation HTTPS
                SSLEngine On

                SSLCertificateFile      /etc/ssl/certs/wildcard.chatillon92.fr.cer
                SSLCertificateKeyFile   /etc/ssl/certs/wildcard.chatillon92.fr.key
                SSLCACertificateFile    /etc/ssl/certs/wildcard.chatillon92.fr_TRUST.cer

# TLS 1.2 minimum : les téléphones des animateurs savent tous faire, et cela
# retire les suites anciennes du champ d'attaque.
                SSLProtocol             -all +TLSv1.2 +TLSv1.3
                SSLHonorCipherOrder     off
                SSLSessionTickets       off

# --- En-têtes transmis à l'application -------------------------------------
# CRITIQUE : Apache AJOUTE l'IP du client à un X-Forwarded-For déjà présent au
# lieu de l'écraser, et Bolt lit la PREMIÈRE adresse de la liste. Sans la purge
# ci-dessous, un client Internet enverrait « X-Forwarded-For: 10.0.0.1 » et se
# ferait passer pour une IP interne auprès du filtre INTERNAL_CIDRS. « early »
# purge l'en-tête dès la lecture de la requête ; mod_proxy le recrée ensuite
# avec la seule adresse réelle du client.
                RequestHeader unset X-Forwarded-For   early
                RequestHeader unset X-Forwarded-Host  early
                RequestHeader unset X-Real-IP         early
                RequestHeader unset Forwarded         early
                RequestHeader set   X-Forwarded-Proto "https"

# --- Proxy -----------------------------------------------------------------
# Protection du proxy mandataire
                ProxyRequests     Off

# Host d'origine conservé : exigé par la vérification d'origine des actions
# serveur de Next.js (sinon l'émargement échoue en « Invalid Server Actions
# request »).
                ProxyPreserveHost On
                ProxyTimeout      60

# Pas de SSLProxyEngine : le tronçon Apache → Bolt est du http en clair, sur un
# segment LAN dédié et filtré par le pare-feu. Le chiffrement s'arrête ici.
# Seuls les préfixes listés ici atteignent l'application.
                ProxyPass        /emargement/    ${BOLT_BACKEND}/emargement/ retry=0
                ProxyPassReverse /emargement/    ${BOLT_BACKEND}/emargement/
                ProxyPass        /icones/        ${BOLT_BACKEND}/icones/ retry=0
                ProxyPass        /_next/static/  ${BOLT_BACKEND}/_next/static/ retry=0
                ProxyPass        /favicon.ico    ${BOLT_BACKEND}/favicon.ico retry=0

# --- Espace agent ----------------------------------------------------------
# Publié CONJOINTEMENT avec PUBLIC_AGENT_ACCESS=1 dans le .env de Bolt : les
# deux filtres sont indépendants, et le second (src/proxy.ts) refuse ces chemins
# tant que la variable est absente. L'un sans l'autre ne publie rien.
#
# Ce qui sort, et ce qui ne sort PAS :
#   /acces            demande d'un lien de connexion par e-mail, et /acces/lien
#                     qui le consomme. Aucun mot de passe n'y est saisissable.
#   /mes-activites    l'espace de l'agent une fois connecté.
#   /mentions         les mentions d'information, liées en pied de cet espace.
#                     Sans elles, l'agent connecté depuis Internet obtient un
#                     403 sur l'information qu'on lui promet consultable.
#   /demande-acces    demande d'accès d'une personne hors annuaire. Ne délivre
#                     rien : ni compte, ni session, ni courriel vers l'adresse
#                     saisie (voir src/lib/demandes.ts).
#   /connexion        JAMAIS. C'est la page qui accepte un identifiant Active
#                     Directory ; publiée, un mot de passe de domaine volé
#                     deviendrait utilisable depuis n'importe où. C'est tout
#                     l'arbitrage de cette architecture : ne pas le défaire ici.
#   /agents/demandes  JAMAIS : l'écran qui valide les demandes est du
#                     back-office, il reste sous /agents.
#
# Second garde-fou, côté application : même avec une session valide obtenue
# depuis Internet, seul un compte AGENT peut l'ouvrir (src/lib/magic.ts,
# `autoriseDepuisInternet`). Une session de gestionnaire ne peut donc pas naître
# ici — ce qui compte, parce qu'une action serveur n'est pas liée au chemin qui
# l'affiche et échapperait au filtrage ci-dessous.
#
# Renseignez aussi « URL de pointage » dans Paramètres → Général : les liens de
# connexion envoyés aux agents s'y adossent. Restés sur l'URL du back-office,
# ils pointeraient vers un nom absent du DNS public.
                ProxyPass        /acces          ${BOLT_BACKEND}/acces retry=0
                ProxyPassReverse /acces          ${BOLT_BACKEND}/acces
                ProxyPass        /mes-activites  ${BOLT_BACKEND}/mes-activites retry=0
                ProxyPassReverse /mes-activites  ${BOLT_BACKEND}/mes-activites
                ProxyPass        /mentions       ${BOLT_BACKEND}/mentions retry=0
                ProxyPass        /demande-acces  ${BOLT_BACKEND}/demande-acces retry=0
                ProxyPassReverse /demande-acces  ${BOLT_BACKEND}/demande-acces

# --- Requêtes que les navigateurs émettent d'eux-mêmes ---------------------
# Ni l'une ni l'autre n'est référencée par une page : le téléphone et le robot
# les demandent spontanément. Sous le « Require all denied » ci-dessous, chacune
# repartait en 403.
#
# Ce n'est pas cosmétique. Les scénarios http-probing et http-crawl-non_statics
# de CrowdSec se déclenchent sur des rafales de 403, et les animateurs pointent
# en 4G — donc plusieurs derrière une même IP publique. Quelques téléphones qui
# installent l'application le même matin suffisaient à faire bannir l'IP, et
# c'est la séance entière qui ne peut plus émarger, un samedi, sans personne
# pour débannir.
#
# Servies par l'application, pas par un fichier posé sur ce serveur : une
# ressource de moins à déployer et à oublier de mettre à jour. iOS réclame
# plusieurs variantes de taille, d'où l'expression régulière.
                ProxyPassMatch   "^/apple-touch-icon.*\.png$" ${BOLT_BACKEND}/icones/bolt-192.png retry=0
                ProxyPass        /robots.txt     ${BOLT_BACKEND}/robots.txt retry=0

# --- Cloisonnement : tout est refusé, puis on rouvre le strict minimum -----
                <Location "/">
                    Require all denied
                </Location>

# PIÈGE ÉVITÉ : ne PAS écrire « Require all granted » + refus sous <LimitExcept>.
# Les deux Require se combinent en OU logique (RequireAny) et le granted
# l'emporte pour TOUTES les méthodes — vérifié en test : un DELETE passait.
# Une seule expression sert d'autorisation ET de filtre de méthode.
                <Location "/emargement">
                    # GET/HEAD (pages) et POST (actions serveur), rien d'autre.
                    Require expr "%{REQUEST_METHOD} in { 'GET', 'POST', 'HEAD' }"
                    # Un pointage ne transporte que quelques kilo-octets. 1 Mo
                    # de marge : tout envoi plus gros est nécessairement anormal.
                    LimitRequestBody 1048576
                </Location>

                <Location "/icones">
                    Require expr "%{REQUEST_METHOD} in { 'GET', 'HEAD' }"
                </Location>

                <Location "/_next/static">
                    Require expr "%{REQUEST_METHOD} in { 'GET', 'HEAD' }"
                </Location>

                <Location "/favicon.ico">
                    Require expr "%{REQUEST_METHOD} in { 'GET', 'HEAD' }"
                </Location>

                <LocationMatch "^/apple-touch-icon.*\.png$">
                    Require expr "%{REQUEST_METHOD} in { 'GET', 'HEAD' }"
                </LocationMatch>

                <Location "/robots.txt">
                    Require expr "%{REQUEST_METHOD} in { 'GET', 'HEAD' }"
                </Location>

# --- Espace agent ----------------------------------------------------------
# GET/HEAD pour les pages, POST pour les actions serveur de Next.js. Rien
# d'autre : une seule expression sert d'autorisation ET de filtre de méthode,
# pour la raison expliquée plus haut (RequireAny).
                <Location "/acces">
                    Require expr "%{REQUEST_METHOD} in { 'GET', 'POST', 'HEAD' }"
                    LimitRequestBody 1048576
                </Location>

                <Location "/mes-activites">
                    Require expr "%{REQUEST_METHOD} in { 'GET', 'POST', 'HEAD' }"
                    LimitRequestBody 1048576
                </Location>

                <Location "/mentions">
                    Require expr "%{REQUEST_METHOD} in { 'GET', 'HEAD' }"
                </Location>

                <Location "/demande-acces">
                    # Un nom, une adresse, deux champs libres : 64 ko suffisent
                    # largement, et bornent ce qu'un dépôt automatisé peut
                    # pousser dans la file.
                    Require expr "%{REQUEST_METHOD} in { 'GET', 'POST', 'HEAD' }"
                    LimitRequestBody 65536
                </Location>

# --- Divers ----------------------------------------------------------------
# HSTS aussi sur les réponses émises par Apache lui-même (403, erreurs) ;
# l'application pose déjà les autres en-têtes de sécurité (CSP, X-Frame-
# Options, nosniff…) sur tout ce qu'elle sert.
                Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"

# Logs
                ErrorLog  ${APACHE_LOG_DIR}/error_boltpointage.log
                CustomLog ${APACHE_LOG_DIR}/access_boltpointage.log combined
</VirtualHost>


# ===========================================================================
# 3. Le maillon NPM
# ===========================================================================
# Réglages du Proxy Host, correction de l'IP cliente et vérification :
#   deploy/npm-boltpointage.md
# L'essentiel : coller dans l'onglet « Advanced » du Proxy Host
#   set_real_ip_from  <IP de cet Apache>;
#   real_ip_header    X-Forwarded-For;
#   real_ip_recursive on;
#   proxy_set_header  X-Forwarded-Proto https;
# et laisser l'onglet SSL sur « None » (un « Force SSL » ferait boucler la chaîne).

# ===========================================================================
# 4. Port 80 — à reporter dans votre fichier de vhosts :80
# ===========================================================================
# La barre oblique FINALE sur la cible est importante : RedirectPermanent colle
# le reste du chemin au bout de la cible. Sans elle, un lien profond — le cas
# normal ici, http://…/emargement/<jeton> — deviendrait
# « https://boltpointage.chatillon92.fremargement/<jeton> », hôte invalide.
#
# # Redirection du site BOLT POINTAGE
# <VirtualHost *:80>
#
#                 ServerName boltpointage.chatillon92.fr
#                 ServerAdmin postmaster@chatillon92.fr
#
# # Activation du RewriteEngine
#                 RewriteEngine On
#
# # Redirection vers le site BOLT POINTAGE
#                 RedirectPermanent / https://boltpointage.chatillon92.fr/
#
# </VirtualHost>
